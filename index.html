<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sieve Analysis Lab | Samar</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{font-family:'Cairo',Tahoma;box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#e0f2fe 0%,#f0f9ff 50%,#fdf4ff 100%);min-height:100vh;padding:15px}
.header{background:linear-gradient(135deg,#1e3a8a,#3b82f6);color:#fff;padding:20px;border-radius:20px;text-align:center;box-shadow:0 10px 25px rgba(59,130,246,.3);margin-bottom:15px}
.header h1{margin:0;font-size:22px}.header p{margin:5px 0 0;opacity:.9;font-size:13px}
.container{max-width:1100px;margin:auto;display:grid;grid-template-columns:320px 1fr;gap:15px}
@media(max-width:800px){.container{grid-template-columns:1fr}}
.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.07);border:1px solid #eef2ff}
.lab-title{font-weight:700;color:#1e3a8a;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.stack-area{display:flex;flex-direction:column;align-items:center}
.motor{width:200px;background:#0f172a;color:#22d3ee;text-align:center;padding:8px;border-radius:10px 10px 4px 4px;font-weight:700;font-size:12px;letter-spacing:1px}
.sieve{width:200px;height:42px;border:2.5px solid #334155;border-bottom:7px solid #94a3b8;background:linear-gradient(#f8fafc,#e2e8f0);display:flex;justify-content:space-between;align-items:center;padding:0 12px;margin-top:-6px;border-radius:6px;font-weight:700;font-size:13px;transition:.2s}
.sieve.active{transform:translateX(8px);border-color:#3b82f6}
.pan{width:200px;height:34px;background:linear-gradient(#fde68a,#fbbf24);border:2.5px solid #92400e;border-top:0;border-radius:0 0 16px 16px;text-align:center;line-height:32px;font-weight:800}
.controls{display:flex;flex-direction:column;gap:8px;margin-top:14px;width:100%}
.btn{border:none;padding:11px;border-radius:12px;font-weight:700;cursor:pointer;transition:.2s;font-size:13px}
.btn-primary{background:linear-gradient(135deg,#1d4ed8,#60a5fa);color:#fff}
.btn-green{background:linear-gradient(135deg,#059669,#34d399);color:#fff}
.btn:active{transform:scale(.97)}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border-radius:12px;border:1px solid #e2e8f0}
th{background:#1e3a8a;color:#fff;padding:10px 6px;font-size:12px}
td{padding:7px 6px;text-align:center;border-bottom:1px solid #f1f5f9;font-size:13px}
input{width:75px;padding:6px;border:1.5px solid #cbd5e1;border-radius:8px;text-align:center;outline:none}
input:focus{border-color:#3b82f6}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.result-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:12px;padding:12px;margin:12px 0;font-size:13px;line-height:1.8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shaking{animation:shake .12s infinite}
</style>
</head>
<body>
<div class="header">
<h1>🔬 معمل تحليل المناخل - Sieve Analysis</h1>
<p>قسم الهندسة المدنية | تصميم: Samar Taha | برج المناخل التفاعلي</p>
</div>

<div class="container">
<div class="card stack-area">
<div class="lab-title">🧪 برج الاختبار</div>
<div class="motor" id="motor">⚫ MOTOR OFF</div>
<div id="stack"></div>
<div class="controls">
<button class="btn btn-green" onclick="shakeLab()">▶️ تشغيل الرجاجة - Shake</button>
<button class="btn btn-primary" onclick="calc()">📊 احسب وارسم المنحنى</button>
<button class="btn" style="background:#f1f5f9" onclick="sample()">🧫 تحميل عينة جاهزة</button>
</div>
<div class="result-box" id="summary">ادخلي أوزان المناخل وسيتم حساب % المار تلقائياً</div>
</div>

<div class="card">
<div class="lab-title">📋 جدول الأوزان والتحليل</div>
<table>
<thead><tr><th>فتحة المنخل mm</th><th>الوزن المتبقي g</th><th>% المتبقي</th><th>% المار</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
<canvas id="chart" height="180" style="margin-top:15px"></canvas>
<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
<span class="badge" style="background:#dbeafe;color:#1e40af" id="bTotal">المجموع:
